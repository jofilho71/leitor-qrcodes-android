<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Leitor de QR Codes</title>
<style>
  :root {
    --bg: #14171c;
    --bg-panel: #1c2028;
    --line: #323944;
    --ink: #e8eaed;
    --ink-dim: #8b93a1;
    --accent: #d3a12e;
    --accent-ink: #14171c;
    --ok: #4caf7d;
    --err: #e0615a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 16px; }
  body.camera-ativa { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding-bottom: 0; }
  body.camera-ativa main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body.camera-ativa .status-bar,
  body.camera-ativa .pendencia { flex: none; }
  body.camera-ativa .rodape { flex: none; }

  header { padding: 10px 14px 8px; }
  .topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .titulo-mini {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-dim); white-space: nowrap;
  }
  .seg-modo { display: flex; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg-modo button {
    border: none; background: transparent; color: var(--ink-dim);
    font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .seg-modo button.ativo { background: var(--accent); color: var(--accent-ink); }

  .sub { color: var(--ink-dim); font-size: 12px; margin: 6px 0 0; }

  main { padding: 8px 14px 0; max-width: 520px; margin: 0 auto; }

  .campos-inventario { display: none; gap: 6px; margin-top: 8px; }
  .campos-inventario select,
  .campos-inventario input[type=text] {
    background: var(--bg-panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: var(--sans);
  }
  .campos-inventario select { flex: 0 0 auto; }
  .campos-inventario input[type=text] { flex: 1; min-width: 0; }

  .botoes-modo { display: flex; gap: 8px; margin-top: 10px; }
  .btn-icone {
    flex: 1;
    border: 1.5px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink);
    border-radius: 10px;
    height: 46px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .btn-icone svg { width: 20px; height: 20px; }
  .btn-icone.ativo { border-color: var(--accent); color: var(--accent); background: #241f13; }
  .btn-icone.csv { font-weight: 800; font-size: 13px; letter-spacing: .02em; }
  input[type=file] { display: none; }

  .pendencia {
    display: none;
    margin-top: 8px; padding: 7px 10px; border-radius: 8px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-size: 12px; text-align: center;
  }
  .pendencia.estado-branco { border-color: var(--ink-dim); color: var(--ink-dim); }
  .pendencia.estado-amarelo { border-color: var(--accent); color: var(--accent); }
  .pendencia.estado-verde { border-color: var(--ok); color: var(--ok); }

  .camera-wrap {
    display: none; margin-top: 8px; border-radius: 12px; overflow: hidden;
    background: #000; position: relative; aspect-ratio: 4 / 3; min-height: 160px;
  }
  body.camera-ativa .camera-wrap { flex: 1; aspect-ratio: auto; min-height: 0; }
  .camera-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-wrap .moldura {
    position: absolute; inset: 14%; border: 2px solid rgba(232,234,237,.85);
    border-radius: 14px; pointer-events: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  .camera-wrap .moldura.estado-branco { border-color: rgba(232,234,237,.85); }
  .camera-wrap .moldura.estado-amarelo { border-color: rgba(211,161,46,.85); }
  .camera-wrap .moldura.estado-verde { border-color: rgba(76,175,125,.85); }
  .camera-wrap .moldura.flash-parcial,
  .camera-wrap .moldura.flash-completo { transform: scale(0.97); }

  .erro-camera {
    display: none; margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: #2a1416; border: 1px solid var(--err); color: #f3a9a5; font-size: 12px; line-height: 1.4;
  }

  .status-bar {
    display: none; margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim);
  }
  .status-bar .barra { height: 3px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .status-bar .barra i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .2s ease; }

  .lista-inventario {
    display: none;
    margin-top: 8px; padding: 6px 10px; border-radius: 8px;
    background: var(--bg-panel); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px;
    max-height: 160px; overflow-y: auto;
  }
  .lista-inventario .item { display: flex; gap: 6px; padding: 3px 0; }
  .lista-inventario .item .ordem { color: var(--ink-dim); flex: none; }
  .lista-inventario .item .codigo { overflow-wrap: anywhere; }
  body.camera-ativa .lista-inventario { flex: none; max-height: 25vh; }

  .rodape {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 14px; border-top: 1px solid var(--line); background: var(--bg-panel);
  }
  .rodape-contador { font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; }
  .rodape-contador b { color: var(--ink); font-weight: 700; }
  .rodape-botoes { display: flex; gap: 6px; }
  .rodape-botoes .btn-icone { height: 38px; width: 38px; flex: none; }
  .rodape-botoes .btn-icone svg { width: 17px; height: 17px; }
</style>
</head>
<body>

<header>
  <div class="topo-linha">
    <span class="titulo-mini">Leitor PAT &amp; BAT - Polo 24 (v 0.9)</span>
    <div class="seg-modo">
      <button type="button" data-modo="bateria" class="ativo">Bateria</button>
      <button type="button" data-modo="inventario">Inventário</button>
    </div>
  </div>
  <p class="sub">Selecione a opção desejada.</p>
</header>

<main>
  <div class="campos-inventario" id="campos-inventario">
    <select id="select-opcao">
      <option>Runin</option>
      <option>Reserva</option>
      <option>Movimentação</option>
      <option>Conserto</option>
    </select>
    <input type="text" id="texto-livre" placeholder="Nota (opcional)" maxlength="80">
  </div>

  <div class="botoes-modo">
    <label class="btn-icone" for="input-fotos" id="btn-galeria" title="Galeria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
    </label>
    <input type="file" id="input-fotos" accept="image/*" multiple>

    <button class="btn-icone" id="btn-camera" type="button" title="Câmera">
      <span id="icone-camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .9-.55L8.7 4.1A1 1 0 0 1 9.6 3.5h4.8a1 1 0 0 1 .9.6l.6 1.35a1 1 0 0 0 .9.55H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.3"/></svg>
      </span>
    </button>
  </div>

  <div class="pendencia" id="pendencia"></div>

  <div class="camera-wrap" id="camera-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div class="moldura" id="moldura"></div>
  </div>

  <div class="erro-camera" id="erro-camera"></div>

  <div class="status-bar" id="status-bar">
    <span id="status-texto">Processando…</span>
    <div class="barra"><i id="status-fill"></i></div>
  </div>

  <div class="lista-inventario" id="lista-inventario"></div>
</main>

<footer class="rodape" id="rodape">
  <span class="rodape-contador" id="contador-texto">Pares coletados: 0</span>
  <div class="rodape-botoes">
    <button class="btn-icone" id="btn-csv" type="button" title="Salvar CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h8V4M8 14h8v6H8v-6Z"/></svg>
    </button>
    <button class="btn-icone" id="btn-compartilhar" type="button" title="Compartilhar CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="12" r="2.4" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="2.4" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="2.4" fill="currentColor" stroke="none"/><path d="M8.1 10.8 15.9 7.2M8.1 13.2l7.8 3.6"/></svg>
    </button>
    <button class="btn-icone" id="btn-limpar" type="button" title="Limpar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4.8c0-.44.36-.8.8-.8h4.4c.44 0 .8.36.8.8V7m-9 0 .8 12.2c.04.6.53 1.07 1.13 1.07h6.14c.6 0 1.09-.47 1.13-1.07L17.5 7"/></svg>
    </button>
  </div>
</footer>

<canvas id="canvas" style="display:none"></canvas>

<script>
(function () {
  "use strict";

  const inputFotos = document.getElementById("input-fotos");
  const btnGaleria = document.getElementById("btn-galeria");
  const btnCamera = document.getElementById("btn-camera");
  const iconeCamera = document.getElementById("icone-camera");
  const pendenciaEl = document.getElementById("pendencia");
  const cameraWrap = document.getElementById("camera-wrap");
  const video = document.getElementById("video");
  const moldura = document.getElementById("moldura");
  const erroCamera = document.getElementById("erro-camera");
  const statusBar = document.getElementById("status-bar");
  const statusTexto = document.getElementById("status-texto");
  const statusFill = document.getElementById("status-fill");
  const contadorTexto = document.getElementById("contador-texto");
  const listaInventario = document.getElementById("lista-inventario");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const btnCsv = document.getElementById("btn-csv");
  const btnCompartilhar = document.getElementById("btn-compartilhar");
  const btnLimpar = document.getElementById("btn-limpar");
  const camposInventario = document.getElementById("campos-inventario");
  const selectOpcao = document.getElementById("select-opcao");
  const textoLivre = document.getElementById("texto-livre");
  const botoesModo = document.querySelectorAll(".seg-modo button");

  const ICONE_CAMERA = iconeCamera.innerHTML;
  const ICONE_PARAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg>';

  let modoAtual = "bateria"; // "bateria" | "inventario"
  let resultados = [];       // bateria: {origem, ok, bruto, campos, pat, erro}
                              // inventario: {codigo, opcao, nota, ok, erro}
  let jsQRCarregado = null;

  // câmera ao vivo
  let streamAtivo = null;
  let intervaloId = null;
  const INTERVALO_MS = 320;

  const ultimoCodigo = { qr: null, pat: null };
  // confirmação por repetição: só câmera ao vivo + modo Bateria, evita descasar par ao
  // virar a câmera acidentalmente para o par vizinho (ver CLAUDE.md)
  const LIMIAR_CONFIRMACAO_CAMERA = window.__LIMIAR_CONFIRMACAO_CAMERA_OVERRIDE || 3;
  const candidato = { qr: null, pat: null }; // {valor, contagem}
  function resetarUltimosCodigos() {
    ultimoCodigo.qr = null;
    ultimoCodigo.pat = null;
    candidato.qr = null;
    candidato.pat = null;
  }

  // padrão de patrimônio da empresa: 10 dígitos, sempre começando com 4551 — vale tanto pro
  // código de barras avulso do Inventário quanto pro PAT_UE pareado no modo Bateria (ver CLAUDE.md)
  const PADRAO_PATRIMONIO = /^4551\d{6}$/;
  // patrimônios já registrados no Inventário nesta sessão — nunca duplica, mesmo entre
  // câmera e galeria ou entre leituras bem espaçadas no tempo (não é um dedup de frame
  // contínuo como o de ultimoCodigo/candidato acima, por isso vive fora de resetarUltimosCodigos
  // e só é zerado quando os resultados também são: troca de modo e botão Limpar)
  let codigosInventarioVistos = new Set();
  // último patrimônio aceito no Inventário (independente de origem) — usado só pra comparar com a
  // leitura seguinte e pegar decode ruidoso do mesmo código físico (poucos dígitos trocados, mesma
  // causa do PADRAO_PATRIMONIO e do codigoTocaBorda, ver CLAUDE.md). Compara só com o anterior, não
  // com todo o histórico (esse é o papel do codigosInventarioVistos, que é um dedup exato)
  let ultimoPatrimonioAceito = null;
  const LIMITE_DIFERENCA_PATRIMONIO = 2;
  function diferencaPequena(a, b, limite) {
    if (!a || !b || a.length !== b.length) return false;
    let diferencas = 0;
    for (let i = 0; i < a.length; i++) {
      if (a[i] !== b[i] && ++diferencas > limite) return false;
    }
    return diferencas > 0;
  }

  // pareamento QR <-> código de barras (PAT_UE) — só no modo Bateria
  // única ordem aceita é QR -> CB; um CB sem QR pendente nunca vira pendência (ver CLAUDE.md)
  // não há mais gravação automática por timeout: um QR sem CB só vira registro
  // "sozinho" quando o usuário interrompe a câmera (ver pararCamera)
  let pendente = { qr: null };

  // estado visual (cor da borda da câmera + caixa de status): branco/amarelo/verde
  const TEXTOS_ESTADO = {
    bateria: { branco: "Esperando leitura de QR Code", amarelo: "Esperando leitura de CB", verde: "Par incluído", verdeSozinho: "Par incluso (sozinho)" },
    inventario: { branco: "Esperando leitura", verde: "Item incluído" }
  };
  let timerEstadoVisual = null;

  function definirEstadoVisual(cor, texto) {
    pendenciaEl.textContent = texto;
    pendenciaEl.style.display = "block";
    pendenciaEl.classList.remove("estado-branco", "estado-amarelo", "estado-verde");
    pendenciaEl.classList.add("estado-" + cor);
    moldura.classList.remove("estado-branco", "estado-amarelo", "estado-verde");
    moldura.classList.add("estado-" + cor);
  }

  function atualizarEstadoVisual() {
    if (timerEstadoVisual) { clearTimeout(timerEstadoVisual); timerEstadoVisual = null; }
    if (modoAtual === "bateria") {
      if (pendente.qr) definirEstadoVisual("amarelo", TEXTOS_ESTADO.bateria.amarelo);
      else definirEstadoVisual("branco", TEXTOS_ESTADO.bateria.branco);
    } else {
      definirEstadoVisual("branco", TEXTOS_ESTADO.inventario.branco);
    }
  }

  function mostrarParIncluido(sozinho) {
    const texto = modoAtual === "bateria"
      ? (sozinho ? TEXTOS_ESTADO.bateria.verdeSozinho : TEXTOS_ESTADO.bateria.verde)
      : TEXTOS_ESTADO.inventario.verde;
    definirEstadoVisual("verde", texto);
    if (timerEstadoVisual) clearTimeout(timerEstadoVisual);
    timerEstadoVisual = setTimeout(() => { timerEstadoVisual = null; atualizarEstadoVisual(); }, 1000);
  }

  // ================= TROCA DE MODO =================
  botoesModo.forEach(btn => {
    btn.addEventListener("click", () => {
      const novoModo = btn.dataset.modo;
      if (novoModo === modoAtual) return;
      if (resultados.length && !window.confirm("Trocar de modo? Os dados ainda não exportados serão perdidos.")) return;
      modoAtual = novoModo;
      botoesModo.forEach(b => b.classList.toggle("ativo", b === btn));
      camposInventario.style.display = modoAtual === "inventario" ? "flex" : "none";
      pararCamera();
      limparPendencia();
      resultados = [];
      codigosInventarioVistos.clear();
      ultimoPatrimonioAceito = null;
      resetarUltimosCodigos();
      atualizarContador();
    });
  });

  // ---------- parsing dos campos CHAVE:VALOR (do conteúdo do QR, modo Bateria) ----------
  function parsearCampos(texto) {
    const campos = {};
    const partes = texto.split(/\s+/).filter(Boolean);
    let chaveAtual = null;
    let valorAtual = [];
    const ehChave = (parte) => {
      const idx = parte.indexOf(":");
      if (idx <= 0) return false;
      const chave = parte.slice(0, idx);
      return chave.length <= 6 && /^[A-Z0-9]+$/.test(chave);
    };
    for (const parte of partes) {
      if (ehChave(parte)) {
        if (chaveAtual) campos[chaveAtual] = valorAtual.join(" ").trim();
        const idx = parte.indexOf(":");
        chaveAtual = parte.slice(0, idx);
        const primeiroValor = parte.slice(idx + 1);
        valorAtual = primeiroValor ? [primeiroValor] : [];
      } else if (chaveAtual) {
        valorAtual.push(parte);
      }
    }
    if (chaveAtual) campos[chaveAtual] = valorAtual.join(" ").trim();
    return Object.keys(campos).length > 1 ? campos : {};
  }

  function registrar(r) {
    resultados.push(r);
    atualizarContador();
  }

  function atualizarContador() {
    const ok = resultados.filter(r => r.ok).length;
    const rotulo = modoAtual === "bateria" ? "Pares" : "Itens";
    contadorTexto.innerHTML = `${rotulo} coletados: <b>${ok}</b>`;
    atualizarListaInventario();
  }

  // escapa o conteúdo lido antes de injetar via innerHTML: o valor vem direto do
  // QR/código de barras (não é texto confiável) e pode conter caracteres de marcação
  function escaparHtml(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // lista os patrimônios do modo Inventário na ordem de leitura; a numeração segue
  // a mesma ordem das linhas do CSV (só itens ok entram em ambos)
  function atualizarListaInventario() {
    if (modoAtual !== "inventario") { listaInventario.style.display = "none"; return; }
    const itensOk = resultados.filter(r => r.ok);
    if (!itensOk.length) { listaInventario.style.display = "none"; listaInventario.innerHTML = ""; return; }
    listaInventario.innerHTML = itensOk.map((r, i) =>
      `<div class="item"><span class="ordem">${i + 1}.</span><span class="codigo">${escaparHtml(r.codigo)}</span></div>`
    ).join("");
    listaInventario.style.display = "block";
    listaInventario.scrollTop = listaInventario.scrollHeight;
  }

  function limparPendencia() {
    pendente = { qr: null };
    atualizarEstadoVisual();
  }

  // ---------- roteamento por modo de cada código detectado ----------
  function processarCodigoDetectado(codigo, origem) {
    if (modoAtual === "inventario") {
      if (codigo.format === "qr_code") return; // só lê código de barras nesse modo, QR é ignorado
      if (!PADRAO_PATRIMONIO.test(codigo.rawValue)) return; // fora do padrão: ignora
      if (codigosInventarioVistos.has(codigo.rawValue)) return; // já lido nesta sessão: descarta
      // decode ruidoso do mesmo código físico pode gerar um valor diferente mas ainda dentro do
      // padrão (poucos dígitos trocados) — compara só com o último aceito, não com todo o
      // histórico, pra não bloquear um patrimônio genuinamente novo só por coincidência de dígitos
      if (diferencaPequena(codigo.rawValue, ultimoPatrimonioAceito, LIMITE_DIFERENCA_PATRIMONIO)) return;
      codigosInventarioVistos.add(codigo.rawValue);
      ultimoPatrimonioAceito = codigo.rawValue;
      const opcao = selectOpcao.value;
      const nota = textoLivre.value.trim();
      registrar({ codigo: codigo.rawValue, opcao, nota, ok: true });
      piscarMoldura("completo");
      mostrarParIncluido();
      return;
    }

    // modo bateria: pareamento QR + código de barras — só QR pode abrir um par;
    // um CB lido sem QR pendente é sempre ignorado, em silêncio (ver CLAUDE.md)
    const tipo = codigo.format === "qr_code" ? "qr" : "pat";
    if (tipo === "pat" && !pendente.qr) return;
    // decode ruidoso do código de barras (câmera com pouca luz/foco) às vezes produz um valor
    // fora do padrão de patrimônio para o mesmo código físico (dígito trocado, dígito a mais) —
    // ignora em silêncio e continua esperando o CB de verdade, mesma lógica do decoy do CDJE
    if (tipo === "pat" && !PADRAO_PATRIMONIO.test(codigo.rawValue)) return;
    // mesmo motivo do modo Inventário: esse dedup existe pra não reprocessar o mesmo frame da
    // câmera repetidas vezes, então não se aplica a fotos distintas da galeria — um código de
    // barras igual ao da foto anterior (etiqueta com erro de impressão/duplicada) é um item
    // diferente e precisa parear com o próprio QR, não ser silenciosamente descartado
    if (origem === "câmera" && ultimoCodigo[tipo] === codigo.rawValue) return;

    if (origem === "câmera") {
      // exige leituras sucessivas do mesmo código antes de aceitar como novo, pra reduzir
      // o risco de pegar por engano um item do par vizinho ao girar a câmera
      const cand = candidato[tipo];
      if (cand && cand.valor === codigo.rawValue) cand.contagem++;
      else candidato[tipo] = { valor: codigo.rawValue, contagem: 1 };
      if (candidato[tipo].contagem < LIMIAR_CONFIRMACAO_CAMERA) return;
      candidato[tipo] = null;
    }
    ultimoCodigo[tipo] = codigo.rawValue;

    if (tipo === "qr") {
      pendente.qr = { bruto: codigo.rawValue, campos: parsearCampos(codigo.rawValue), origem };
      piscarMoldura("parcial");
      atualizarEstadoVisual();
      return;
    }

    // tipo === "pat", com QR pendente: se repetir o CDJE do próprio QR, é o CB "decoy"
    // colado na etiqueta da bateria (não é o PAT_UE da urna) — ignora em silêncio
    if (pendente.qr.campos && codigo.rawValue === pendente.qr.campos.CDJE) return;

    registrar({
      origem: pendente.qr.origem, ok: true,
      bruto: pendente.qr.bruto, campos: pendente.qr.campos, pat: codigo.rawValue
    });
    pendente = { qr: null };
    piscarMoldura("completo");
    mostrarParIncluido(false);
  }

  // ---------- formatos suportados / detector nativo ----------
  const FORMATOS_DESEJADOS = ["qr_code", "code_128", "code_39", "code_93", "codabar", "ean_13", "ean_8", "itf", "upc_a", "upc_e", "data_matrix", "pdf417"];
  let formatosCache = null;
  let detectorCache = null;

  async function obterFormatosSuportados() {
    if (formatosCache) return formatosCache;
    if (!("BarcodeDetector" in window)) { formatosCache = []; return formatosCache; }
    try {
      if (window.BarcodeDetector.getSupportedFormats) {
        const suportados = await window.BarcodeDetector.getSupportedFormats();
        formatosCache = FORMATOS_DESEJADOS.filter(f => suportados.includes(f));
      } else {
        formatosCache = FORMATOS_DESEJADOS.slice();
      }
    } catch (e) { formatosCache = ["qr_code"]; }
    if (!formatosCache.includes("qr_code")) formatosCache.unshift("qr_code");
    if (!formatosCache.length) formatosCache = ["qr_code"];
    return formatosCache;
  }

  async function obterDetectorNativo() {
    if (detectorCache) return detectorCache;
    const formatos = await obterFormatosSuportados();
    try { detectorCache = new window.BarcodeDetector({ formats: formatos }); }
    catch (e) {
      try { detectorCache = new window.BarcodeDetector({ formats: ["qr_code"] }); }
      catch (e2) { detectorCache = null; }
    }
    return detectorCache;
  }

  // descarta uma detecção cuja caixa delimitadora encosta na borda do frame — sinal de que o
  // código pode estar cortado (fora do quadro), o que em formatos de barras lineares mais fracos
  // (ex.: ITF, sem checksum obrigatório) pode decodificar como um valor menor/diferente do código
  // inteiro. Só o detector nativo devolve boundingBox; jsQR só lê QR (correção de erro própria,
  // sem esse risco), então essa checagem não se aplica a ele.
  const MARGEM_BORDA_FRACAO = 0.02;
  function codigoTocaBorda(deteccao, largura, altura) {
    const caixa = deteccao.boundingBox;
    if (!caixa || !largura || !altura) return false;
    const margemX = largura * MARGEM_BORDA_FRACAO;
    const margemY = altura * MARGEM_BORDA_FRACAO;
    return caixa.x <= margemX || caixa.y <= margemY ||
      (caixa.x + caixa.width) >= (largura - margemX) ||
      (caixa.y + caixa.height) >= (altura - margemY);
  }

  function garantirJsQR() {
    if (window.jsQR) return Promise.resolve();
    if (jsQRCarregado) return jsQRCarregado;
    jsQRCarregado = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("sem conexão para carregar biblioteca de apoio"));
      document.head.appendChild(s);
    });
    // se falhar (rede indisponível no momento), não guarda a rejeição em cache — senão uma
    // queda de conexão pontual trava o fallback pro resto da sessão, mesmo com internet de volta
    jsQRCarregado.catch(() => { jsQRCarregado = null; });
    return jsQRCarregado;
  }

  // ================= MODO GALERIA =================
  function carregarImagem(arquivo) {
    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("não foi possível decodificar a imagem"));
        img.src = leitor.result;
      };
      leitor.onerror = () => reject(new Error("não foi possível ler o arquivo"));
      leitor.readAsDataURL(arquivo);
    });
  }

  function desenharEmCanvas(img, escala) {
    const w = Math.max(1, Math.round(img.naturalWidth * escala));
    const h = Math.max(1, Math.round(img.naturalHeight * escala));
    canvas.width = w; canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return { w, h };
  }

  // decodifica o canvas (já desenhado pelo chamador) via jsQR — compartilhado entre galeria e
  // câmera pra não duplicar o trio getImageData/jsQR/montagem do resultado nos dois lugares
  function decodificarCanvasComJsQR(w, h) {
    const dados = ctx.getImageData(0, 0, w, h);
    const resultado = window.jsQR(dados.data, w, h);
    return resultado && resultado.data ? [{ rawValue: resultado.data, format: "qr_code" }] : [];
  }

  async function detectarCodigosEmImagem(img) {
    if ("BarcodeDetector" in window) {
      const detector = await obterDetectorNativo();
      if (detector) {
        for (const escala of [1, 0.5, 1.5]) {
          const fator = Math.min(escala, (1600 / Math.max(img.naturalWidth, img.naturalHeight)) * escala || escala);
          desenharEmCanvas(img, fator);
          try {
            const codigos = await detector.detect(canvas);
            const validos = (codigos || []).filter(c => !codigoTocaBorda(c, canvas.width, canvas.height));
            if (validos.length) return validos.map(c => ({ rawValue: c.rawValue, format: c.format }));
          } catch (e) { /* tenta próxima escala */ }
        }
      }
    }
    try {
      await garantirJsQR();
      for (const escala of [1, 0.5, 1.5]) {
        const { w, h } = desenharEmCanvas(img, escala);
        const codigos = decodificarCanvasComJsQR(w, h);
        if (codigos.length) return codigos;
      }
    } catch (e) { /* sem internet e sem suporte nativo */ }
    return [];
  }

  inputFotos.addEventListener("change", async (ev) => {
    const arquivos = Array.from(ev.target.files || []);
    if (!arquivos.length) return;
    pararCamera();
    resetarUltimosCodigos();
    statusBar.style.display = "block";
    let processados = 0;

    for (const arquivo of arquivos) {
      statusTexto.textContent = `${processados + 1}/${arquivos.length}`;
      statusFill.style.width = Math.round((processados / arquivos.length) * 100) + "%";
      try {
        const img = await carregarImagem(arquivo);
        const codigos = await detectarCodigosEmImagem(img);
        if (!codigos.length) {
          if (modoAtual === "bateria") {
            registrar({ origem: "galeria", ok: false, erro: "Nenhum código encontrado" });
          } else {
            registrar({ codigo: "", opcao: "", nota: "", ok: false, erro: "Nenhum código encontrado" });
          }
        } else {
          // dentro de uma mesma foto, o QR precisa ser processado antes do CB (regra
          // de ordem do modo Bateria) — a ordem de retorno do detector não é garantida
          const ordenados = codigos.slice().sort((a, b) =>
            (a.format === "qr_code" ? 0 : 1) - (b.format === "qr_code" ? 0 : 1));
          for (const codigo of ordenados) {
            processarCodigoDetectado(codigo, "galeria");
          }
        }
      } catch (e) {
        if (modoAtual === "bateria") registrar({ origem: "galeria", ok: false, erro: e.message });
        else registrar({ codigo: "", opcao: "", nota: "", ok: false, erro: e.message });
      }
      processados++;
      statusFill.style.width = Math.round((processados / arquivos.length) * 100) + "%";
      await new Promise(res => setTimeout(res, 0));
    }

    statusTexto.textContent = `${processados} processada(s)`;
    setTimeout(() => { statusBar.style.display = "none"; }, 1500);
    inputFotos.value = "";
  });

  // ================= MODO CÂMERA =================
  async function iniciarCamera() {
    erroCamera.style.display = "none";
    resetarUltimosCodigos();
    try {
      streamAtivo = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }, audio: false
      });
    } catch (e) {
      erroCamera.textContent = "Câmera indisponível: " + (e.message || e.name || "permissão negada.");
      erroCamera.style.display = "block";
      return;
    }
    video.srcObject = streamAtivo;
    try {
      await video.play();
    } catch (e) {
      // sem isso, um play() rejeitado (ex.: restrição de autoplay em WebView) deixava a UI
      // da câmera "ativa" com o vídeo congelado, sem detectar nada e sem aviso nenhum
      streamAtivo.getTracks().forEach(t => t.stop());
      streamAtivo = null;
      video.srcObject = null;
      erroCamera.textContent = "Câmera indisponível: falha ao iniciar o vídeo (" + (e.message || e.name || "erro desconhecido") + ").";
      erroCamera.style.display = "block";
      return;
    }
    cameraWrap.style.display = "block";
    document.body.classList.add("camera-ativa");
    btnCamera.classList.add("ativo");
    iconeCamera.innerHTML = ICONE_PARAR;
    btnGaleria.style.opacity = ".5";
    btnGaleria.style.pointerEvents = "none";
    atualizarEstadoVisual();

    const detectorNativo = ("BarcodeDetector" in window) ? await obterDetectorNativo() : null;

    const tick = async () => {
      if (!streamAtivo || video.readyState < 2) return;
      try {
        let codigos = [];
        if (detectorNativo) {
          const brutos = await detectorNativo.detect(video);
          codigos = (brutos || [])
            .filter(c => !codigoTocaBorda(c, video.videoWidth, video.videoHeight))
            .map(c => ({ rawValue: c.rawValue, format: c.format }));
        } else {
          await garantirJsQR();
          const w = video.videoWidth, h = video.videoHeight;
          if (w && h) {
            canvas.width = w; canvas.height = h;
            ctx.drawImage(video, 0, 0, w, h);
            codigos = decodificarCanvasComJsQR(w, h);
          }
        }
        for (const codigo of codigos) {
          processarCodigoDetectado(codigo, "câmera");
        }
      } catch (e) { /* ignora falha pontual de um frame */ }
    };
    intervaloId = setInterval(tick, INTERVALO_MS);
  }

  function piscarMoldura(tipo) {
    const classe = tipo === "completo" ? "flash-completo" : "flash-parcial";
    moldura.classList.add(classe);
    setTimeout(() => moldura.classList.remove(classe), 300);
    if (navigator.vibrate) { try { navigator.vibrate(tipo === "completo" ? [40, 40, 60] : 50); } catch (e) {} }
  }

  function pararCamera() {
    const estavaAtiva = !!streamAtivo;
    if (intervaloId) clearInterval(intervaloId);
    intervaloId = null;
    if (streamAtivo) { streamAtivo.getTracks().forEach(t => t.stop()); streamAtivo = null; }
    video.srcObject = null;
    cameraWrap.style.display = "none";
    document.body.classList.remove("camera-ativa");
    btnCamera.classList.remove("ativo");
    iconeCamera.innerHTML = ICONE_CAMERA;
    btnGaleria.style.opacity = "";
    btnGaleria.style.pointerEvents = "";

    // interromper a câmera com um QR pendente é a única forma de gravar um par sem
    // CB — nunca automático por tempo (ver CLAUDE.md); avisa o usuário do ocorrido
    if (estavaAtiva && modoAtual === "bateria" && pendente.qr) {
      registrar({ origem: pendente.qr.origem, ok: true, bruto: pendente.qr.bruto, campos: pendente.qr.campos, pat: "" });
      pendente = { qr: null };
      mostrarParIncluido(true);
      mostrarErroTemporario("QR gravado sem par (código de barras não lido). Leia novamente se precisar completar outro par.");
    }
  }

  btnCamera.addEventListener("click", () => { if (streamAtivo) pararCamera(); else iniciarCamera(); });

  // ================= EXPORTAR / LIMPAR =================
  // os dois únicos delimitadores usados nos CSVs exportados (bateria usa "," e inventário usa
  // ";") — regex pré-compilada em vez de montar uma nova a cada célula de cada linha exportada
  const RE_CSV_ESPECIAL = { ",": /["\n,]/, ";": /["\n;]/ };
  function escaparCsv(valor, delimitador) {
    const s = String(valor ?? "");
    if (RE_CSV_ESPECIAL[delimitador].test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function gerarCsvBateria() {
    const todasChaves = [];
    for (const r of resultados) {
      for (const k of Object.keys(r.campos || {})) {
        if (k !== "CDJE" && !todasChaves.includes(k)) todasChaves.push(k);
      }
    }
    const colunas = ["PAT_UE", "CDJE", "origem", "status", ...todasChaves, "conteudo_bruto"];
    const linhas = [colunas.join(",")];
    for (const r of resultados) {
      const linha = colunas.map(c => {
        if (c === "PAT_UE") return escaparCsv(r.pat || "", ",");
        if (c === "origem") return escaparCsv(r.origem, ",");
        if (c === "status") return escaparCsv(r.ok ? "OK" : (r.erro || "código não encontrado"), ",");
        if (c === "conteudo_bruto") return escaparCsv(r.bruto || "", ",");
        return escaparCsv((r.campos || {})[c] || "", ",");
      });
      linhas.push(linha.join(","));
    }
    return "\uFEFF" + linhas.join("\r\n");
  }

  function gerarCsvInventario() {
    const linhas = ["Patrimônio;Opção;Nota"];
    for (const r of resultados) {
      if (!r.ok) continue;
      linhas.push(`${escaparCsv(r.codigo, ";")};${escaparCsv(r.opcao, ";")};${escaparCsv(r.nota, ";")}`);
    }
    return "\uFEFF" + linhas.join("\r\n");
  }

  // remove caracteres inválidos em nome de arquivo (a nota é texto livre do usuário)
  function sanitizarNomeArquivo(valor) {
    return String(valor).replace(/[\\/:*?"<>|]+/g, "-").trim();
  }

  function gerarNomeArquivo() {
    const carimbo = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    if (modoAtual === "inventario") {
      const opcao = sanitizarNomeArquivo(selectOpcao.value);
      const nota = sanitizarNomeArquivo(textoLivre.value.trim());
      const partes = ["Inventário", opcao];
      if (nota) partes.push(nota);
      partes.push(carimbo);
      return partes.join("_") + ".csv";
    }
    return `${modoAtual}_${carimbo}.csv`;
  }

  function obterCsvAtual() {
    return modoAtual === "inventario" ? gerarCsvInventario() : gerarCsvBateria();
  }

  function mostrarErroTemporario(msg) {
    erroCamera.textContent = msg;
    erroCamera.style.display = "block";
    setTimeout(() => { erroCamera.style.display = "none"; }, 3500);
  }

  btnCsv.addEventListener("click", () => {
    const csv = obterCsvAtual();
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = gerarNomeArquivo();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  btnCompartilhar.addEventListener("click", async () => {
    const csv = obterCsvAtual();
    const nomeArquivo = gerarNomeArquivo();
    let arquivo;
    try {
      arquivo = new File([csv], nomeArquivo, { type: "text/csv" });
    } catch (e) {
      mostrarErroTemporario("Compartilhamento não suportado neste navegador.");
      return;
    }
    if (!navigator.canShare || !navigator.canShare({ files: [arquivo] })) {
      mostrarErroTemporario("Este navegador não aceita compartilhar arquivos. Use Salvar.");
      return;
    }
    try {
      await navigator.share({ files: [arquivo] });
    } catch (e) {
      if (e && e.name !== "AbortError") mostrarErroTemporario("Falha ao compartilhar: " + (e.message || e.name));
    }
  });

  btnLimpar.addEventListener("click", () => {
    resultados = [];
    codigosInventarioVistos.clear();
    ultimoPatrimonioAceito = null;
    resetarUltimosCodigos();
    limparPendencia();
    atualizarContador();
    inputFotos.value = "";
  });

  atualizarEstadoVisual();
})();
</script>
</body>
